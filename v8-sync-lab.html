<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>智取店勤務助手 v8.0.0-alpha 同步測試台</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#243047;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.top{background:#18345d;color:#fff;padding:18px}.top h1{font-size:20px;margin:0}.warn{background:#fff3cd;color:#714f00;padding:12px 18px;border-bottom:1px solid #ead18b}.wrap{max-width:880px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #1d355718}.card h2{font-size:17px;margin:0 0 14px;color:#1e63a8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}label{display:block;font-size:13px;color:#5a6577;margin:8px 0 4px}input,select{width:100%;padding:12px;border:1px solid #cbd4e2;border-radius:10px;font-size:16px}button{border:0;border-radius:10px;padding:11px 15px;background:#1688e8;color:#fff;font-weight:700;margin:5px 4px 5px 0}button.alt{background:#64748b}button.danger{background:#e34a35}button:disabled{opacity:.45}.status{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pill{background:#eef5fd;border-radius:10px;padding:10px;font-size:12px}.pill b{display:block;font-size:15px;margin-top:4px;overflow-wrap:anywhere}.log{white-space:pre-wrap;background:#101827;color:#dbeafe;padding:12px;border-radius:10px;min-height:90px;max-height:230px;overflow:auto;font:12px ui-monospace,monospace}.member{display:grid;grid-template-columns:1fr 110px 90px 80px;gap:8px;align-items:center;border-top:1px solid #eee;padding:8px 0}@media(max-width:650px){.status{grid-template-columns:1fr 1fr}.member{grid-template-columns:1fr 90px}.member button{grid-column:2}.member select{grid-column:1}}
</style></head><body><header class="top"><h1>📦 智取店勤務助手 v8.0.0-alpha｜同步測試台</h1></header><div class="warn">⚠️ 隔離測試：不會改寫正式版 localStorage。請使用全新的 Supabase 專案，絕對不要貼入口罩專案的設定。</div><main class="wrap">
<section class="card"><h2>1. 測試專案設定</h2><div class="grid"><div><label>Supabase Project URL</label><input id="url" placeholder="https://xxxx.supabase.co"></div><div><label>Publishable／anon key</label><input id="key" type="password" placeholder="sb_publishable_… 或 anon key"></div></div><button id="saveConfig">儲存於本機</button><button class="alt" id="clearConfig">清除設定與登入</button></section>
<section class="card"><h2>2. 帳號密碼登入</h2><p>不開放自行註冊；請使用管理員已建立的帳號。</p><div class="grid"><div><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="name@example.com"></div><div><label>密碼</label><input id="password" type="password" autocomplete="current-password" placeholder="輸入密碼"></div></div><button id="login">登入</button><button class="alt" id="logout">登出</button><p id="identity">尚未登入</p></section>
<section class="card"><h2>3. v7.1.19 資料副本</h2><input id="file" type="file" accept="application/json,.json"><button id="upload">上傳測試資料</button><button id="load" class="alt">下載雲端資料</button><button id="download" class="alt">下載目前快照</button><button id="conflict" class="danger">衝突保護測試</button></section>
<section class="card"><h2>同步檢查</h2><div class="status"><div class="pill">帳號狀態<b id="member">—</b></div><div class="pill">雲端版本<b id="version">—</b></div><div class="pill">shopee_ 鍵值<b id="count">0</b></div><div class="pill">容量／SHA-256<b id="digest">—</b></div></div></section>
<section class="card" id="adminCard" hidden><h2>管理員：帳號審核</h2><button id="refreshMembers">重新整理名單</button><div id="members"></div></section>
<section class="card"><h2>測試紀錄</h2><div class="log" id="log">等待操作…</div></section>
</main><script>
'use strict';
const CFG='store-v8-lab-config-v1', SESSION='store-v8-lab-session-v1', SNAP='store-v8-lab-snapshot-v1';
const $=id=>document.getElementById(id); let session=null, member=null, cloudVersion=null, snapshot={};
const note=(s)=>{$('log').textContent=`[${new Date().toLocaleTimeString()}] ${s}\n`+$('log').textContent};
const config=()=>({url:$('url').value.trim().replace(/\/$/,''),key:$('key').value.trim()});
function headers(auth=true){const c=config(),h={'apikey':c.key,'Content-Type':'application/json'};if(auth&&session?.access_token)h.Authorization=`Bearer ${session.access_token}`;return h}
async function api(path,opt={}){const c=config();if(!c.url||!c.key)throw Error('請先填寫並儲存 Supabase 設定');let r=await fetch(c.url+path,{...opt,headers:{...headers(opt.auth!==false),...(opt.headers||{})}});let body=await r.text(),data;try{data=body?JSON.parse(body):null}catch{data=body}if(!r.ok)throw Error(data?.message||data?.msg||data?.error_description||String(data));return data}
async function rpc(name,args={}){return api('/rest/v1/rpc/'+name,{method:'POST',body:JSON.stringify(args)})}
function saveSession(){session?localStorage.setItem(SESSION,JSON.stringify(session)):localStorage.removeItem(SESSION)}
function saveSnap(){localStorage.setItem(SNAP,JSON.stringify(snapshot));updateStats()}
async function sha(text){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function canonical(value){if(Array.isArray(value))return value.map(canonical);if(value&&typeof value==='object')return Object.fromEntries(Object.keys(value).sort().map(k=>[k,canonical(value[k])]));return value}
async function updateStats(){const text=JSON.stringify(canonical(snapshot));$('count').textContent=Object.keys(snapshot).filter(k=>k.startsWith('shopee_')).length;const hash=await sha(text);$('digest').textContent=`${new Blob([text]).size} B / ${hash.slice(0,12)}`}
async function register(){if(!session)return;member=await rpc('store_test_register_current_user');$('identity').textContent=session.user?.email||member.email;$('member').textContent=member.approved?`${member.role}／已核准`:'等待管理員核准';$('adminCard').hidden=!(member.approved&&member.role==='admin');if(member.approved)await loadCloud(false);}
async function refreshToken(){if(!session?.refresh_token)return;try{session=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:JSON.stringify({refresh_token:session.refresh_token})});saveSession()}catch(e){note('登入更新失敗：'+e.message)}}
async function loadCloud(verbose=true){const rows=await rpc('store_test_load_state'),row=Array.isArray(rows)?rows[0]:rows;if(!row)return;cloudVersion=Number(row.version);snapshot=row.payload||{};saveSnap();$('version').textContent=cloudVersion;verbose&&note(`已下載雲端 v${cloudVersion}`)}
async function boot(){const c=JSON.parse(localStorage.getItem(CFG)||'{}');$('url').value=c.url||'';$('key').value=c.key||'';snapshot=JSON.parse(localStorage.getItem(SNAP)||'{}');updateStats();session=JSON.parse(localStorage.getItem(SESSION)||'null');const hash=new URLSearchParams(location.hash.slice(1));if(hash.get('access_token')){session={access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token'),expires_in:Number(hash.get('expires_in')||3600),user:{email:hash.get('email')||''}};saveSession();history.replaceState(null,'',location.pathname+location.search)}if(session){await refreshToken();try{await register()}catch(e){note('登入／註冊：'+e.message)}}}
$('saveConfig').onclick=()=>{localStorage.setItem(CFG,JSON.stringify(config()));note('測試專案設定已儲存於本機')};
$('clearConfig').onclick=()=>{[CFG,SESSION].forEach(k=>localStorage.removeItem(k));session=null;member=null;$('url').value=$('key').value='';$('identity').textContent='尚未登入';note('已清除設定與登入')};
$('login').onclick=async()=>{try{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)throw Error('請輸入 Email 與密碼');session=await api('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:JSON.stringify({email,password})});saveSession();$('password').value='';await register();note('登入成功')}catch(e){note('登入失敗：'+e.message)}};
$('logout').onclick=()=>{session=null;member=null;saveSession();$('identity').textContent='尚未登入';$('member').textContent='—';$('adminCard').hidden=true;note('已登出')};
$('file').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(!obj||Array.isArray(obj)||typeof obj!=='object')throw Error('JSON 根節點必須是物件');const keys=Object.keys(obj).filter(k=>k.startsWith('shopee_'));if(!keys.length)throw Error('找不到 shopee_ 開頭的資料');snapshot=Object.fromEntries(keys.map(k=>[k,obj[k]]));saveSnap();note(`已匯入隔離副本：${keys.length} 個鍵值`)}catch(err){note('匯入失敗：'+err.message)}};
$('upload').onclick=async()=>{try{if(cloudVersion===null)await loadCloud(false);const row=await rpc('store_test_save_state',{p_payload:snapshot,p_expected_version:cloudVersion});const r=Array.isArray(row)?row[0]:row;cloudVersion=Number(r.version);$('version').textContent=cloudVersion;note(`上傳成功：雲端 v${cloudVersion}`)}catch(e){note('上傳失敗：'+e.message)}};
$('load').onclick=()=>loadCloud().catch(e=>note('下載失敗：'+e.message));
$('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(snapshot,null,2)],{type:'application/json'}));a.download=`store-v8-lab-v${cloudVersion??'local'}.json`;a.click();URL.revokeObjectURL(a.href)};
$('conflict').onclick=async()=>{try{if(cloudVersion===null)await loadCloud(false);await rpc('store_test_save_state',{p_payload:snapshot,p_expected_version:Math.max(-1,cloudVersion-1)});note('❌ 測試失敗：舊版本竟然可以覆寫')}catch(e){note((String(e.message).includes('SYNC_CONFLICT')?'✅ 衝突保護成功：':'測試結果：')+e.message)}};
$('refreshMembers').onclick=async()=>{try{const rows=await rpc('store_test_list_members');$('members').innerHTML='';rows.forEach(m=>{const d=document.createElement('div');d.className='member';const em=document.createElement('span');em.textContent=m.email;const role=document.createElement('select');['admin','editor','viewer'].forEach(x=>role.add(new Option(x,x,x===m.role,x===m.role)));const ap=document.createElement('input');ap.type='checkbox';ap.checked=m.approved;const b=document.createElement('button');b.textContent='儲存';b.onclick=async()=>{try{await rpc('store_test_update_member',{p_user_id:m.user_id,p_role:role.value,p_approved:ap.checked});note('已更新 '+m.email)}catch(e){note('更新失敗：'+e.message)}};d.append(em,role,ap,b);$('members').append(d)})}catch(e){note('讀取名單失敗：'+e.message)}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./v8-sync-lab-sw.js').then(()=>note('離線頁面快取已啟用')).catch(e=>note('離線快取啟用失敗：'+e.message));
boot().catch(e=>note('啟動失敗：'+e.message));
</script></body></html>
